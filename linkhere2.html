<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #2D1B4E;
    line-height: 1.6;
    background-color: #FFFFFF;
    margin: 0;
    padding: 0;
}

.header-banner {
    background: linear-gradient(135deg, #F1C5E2 0%, #D1FFFF 50%, #EBD1FF 100%);
    padding: 40px 20px;
    text-align: center;
    border-bottom: 4px solid #53EFF5;
}

.header-banner h1 {
    font-size: 2.5rem;
    color: #2D1B4E;
    margin: 0 0 10px 0;
    font-weight: 800;
}

.header-banner .subtitle {
    font-size: 1.2rem;
    color: #4A3E56;
    margin: 0;
}

.content-container {
    max-width: 800px;
    margin: 30px auto;
    padding: 0 20px;
}

.intro {
    font-size: 1.15rem;
    color: #3D4A51;
    margin-bottom: 40px;
    text-align: justify;
}

.concept-card {
    background-color: #FFFFFF;
    border-left: 5px solid #53EFF5;
    padding: 10px 0 10px 20px;
    margin-bottom: 25px;
    transition: all 0.3s ease;
}

.concept-card:nth-child(even) { border-left-color: #EBD1FF; }
.concept-card:nth-child(3n) { border-left-color: #F1C5E2; }

.concept-card h2 {
    font-size: 1.4rem;
    color: #2D1B4E;
    margin: 0 0 8px 0;
}

.concept-card p {
    color: #445158;
    margin: 0;
    text-align: justify;
}

.footer-box {
    background-color: #D1FFFF;
    border-radius: 8px;
    padding: 20px;
    margin-top: 40px;
    border: 1px solid #53EFF5;
}

.footer-box strong {
    color: #1A3D40;
    font-size: 1.2rem;
    display: block;
    margin-bottom: 8px;
}

.footer-box p {
    color: #2C4A4D;
    margin: 0;
    font-style: italic;
}

/* MOBILE FIX */
@media (max-width: 768px) {

    .header-banner {
        padding: 30px 15px;
    }

    .header-banner h1 {
        font-size: 1.8rem;
        line-height: 1.3;
    }

    .header-banner .subtitle {
        font-size: 1rem;
    }

    .content-container {
        margin: 20px auto;
        padding: 0 15px;
    }

    .intro {
        font-size: 1rem;
        margin-bottom: 25px;
        text-align: left;
    }

    .concept-card {
        padding: 12px 15px;
        margin-bottom: 18px;
    }

    .concept-card h2 {
        font-size: 1.15rem;
        line-height: 1.4;
    }

    .concept-card p {
        font-size: 0.95rem;
        text-align: left;
    }

    .footer-box {
        padding: 15px;
    }

    .footer-box strong {
        font-size: 1.1rem;
    }

    .footer-box p {
        font-size: 0.95rem;
    }
}
</style>
